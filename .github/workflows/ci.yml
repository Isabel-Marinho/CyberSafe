name: CI CyberSafe Ionic

# Quando o pipeline roda: a cada push e a cada pull request na main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: 1. Lint (qualidade do código)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: 2. Testes automatizados (Vitest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rodar os testes uma vez, sem modo watch
        run: npm test -- --no-watch

  build:
    name: 3. Build de produção
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --configuration production
      - name: Guardar o build gerado
        uses: actions/upload-artifact@v4
        with:
          name: build-www
          path: www/
