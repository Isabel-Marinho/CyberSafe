name: CD Deploy no GitHub Pages

# Entrega contínua: a cada push na main, publica a versão web do app
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build com o endereço correto do GitHub Pages
        run: npm run build -- --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: Localizar a pasta do build
        run: |
          if [ -f www/browser/index.html ]; then
            echo "SITE_DIR=www/browser" >> $GITHUB_ENV
          else
            echo "SITE_DIR=www" >> $GITHUB_ENV
          fi

      - name: Fallback para rotas do Angular
        run: cp $SITE_DIR/index.html $SITE_DIR/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}
      - id: deployment
        uses: actions/deploy-pages@v4
